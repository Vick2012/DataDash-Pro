[package]
name = "datadash-pro-bi"
version = "1.0.0"
description = "DataDash Pro BI - Aplicación de escritorio"
edition = "2021"

[lib]
name = "datadash_pro_bi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sin `default-features`: evita parquet/csv/cloud de la feature `default` y acelera mucho `tauri dev`.
# Sin `dtype-full`: menos crates (la ventana no abre hasta que termine la primera compilación).
polars = { version = "0.53", default-features = false, features = [
  "lazy",
  "new_streaming",
  "rows",
  "fmt",
  "strings",
  "temporal",
  "dtype-slim",
  "zip_with",
] }
calamine = "0.26"
tokio = { version = "1", features = ["sync", "fs"] }
chrono = "0.4"
edit-xlsx = "0.4"
printpdf = "0.7"
